plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseSigning = keystorePropertiesFile.exists() &&
        keystoreProperties["storeFile"] &&
        keystoreProperties["storePassword"] &&
        keystoreProperties["keyAlias"] &&
        keystoreProperties["keyPassword"]

android {
    namespace = "io.github.dey410.gardendlessloader"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "io.github.dey410.gardendlessloader"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                // AGP 在 minSdk >= 24 时默认只签 v2，部分国产 ROM 的安装器
                // 找不到 META-INF 下的 JAR 签名就直接报「安装包没有签名文件」。
                // 三种方案全开：v1 兼容老安装器，v2/v3 是现代的完整性校验。
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    // FileProvider, for handing a downloaded APK to the system installer.
    implementation "androidx.core:core:1.13.1"
    testImplementation "junit:junit:4.13.2"
    // Android's android.jar ships stub org.json that throws in JVM unit tests;
    // the real implementation keeps JSON parsing tests meaningful.
    testImplementation "org.json:json:20240303"
}
