name: gardendless_loader
description: Local Flutter loader for user-supplied PvZ2 Gardendless web resources.
publish_to: "none"
version: 0.9.0-hlh.37+90037

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^10.1.0
  package_info_plus_ohos: ^0.0.7
  path: ^1.9.0
  path_provider: ^2.1.5
  wakelock_plus: ^1.4.0
  # 选择资源存储目录（双端：Android 走 SAF 目录选择，Windows 走原生对话框）
  file_picker: ^13.2.0
  # 仅 Windows 用：自带 CEF(Chromium) 内核的游戏窗口。
  # 选它而不是 WebView2 系的原因：WebView2 的两个 Flutter 包分别锁死
  # Dart>=3.12 / sdk<3.0，与当前 Flutter 3.41.9(Dart 3.11.5) 都冲突；
  # CEF 自带内核，也不依赖用户机器上的 Edge 版本。
  webview_cef: ^0.6.2

dev_dependencies:
  flutter_lints: ^5.0.0

dependency_overrides:
  # 仅 Windows 用。vendor 一份的唯一原因：vsync 源要跟「窗口所在显示器」，
  # 上游写死 EnumAdapters1(0)/EnumOutputs(0)，多屏/虚拟显示器/远程桌面下会
  # 等错屏幕的 vblank。补丁见 packages/webview_cef/VENDORED.md。
  webview_cef:
    path: packages/webview_cef

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - about_content.json
    - tool/generated_icons/app_icon_master.png
    - assets/game_bridge/
    - assets/artwork/launcher_poster.png
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
