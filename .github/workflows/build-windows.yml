# Windows 桌面客户端构建
#
# 为什么单独一个 workflow：上游的 build-mobile.yml 有一个「必须三端产物齐全」
# 的 release 门禁，把 Windows 塞进去会打乱它的证据链。这里独立构建，
# 通过 workflow_dispatch 手动触发，或在打 tag 时自动附到 Release。
#
# 服务器地址不写进源码：用仓库 secret PVZGE_SERVER 注入（--dart-define）。
# 缺这个 secret 也能构建，只是客户端需要在设置页手填地址。
name: Build Windows Client

on:
  workflow_dispatch:
    inputs:
      server:
        description: "服务器地址（留空则用 secret PVZGE_SERVER）"
        required: false
        default: ""
  push:
    tags:
      - "v*-hlh.*"
    paths:
      - "lib/**"
      - "windows/**"
      - "pubspec.yaml"
      - "tools/build-windows.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        env:
          PVZGE_SERVER: ${{ github.event.inputs.server != '' && github.event.inputs.server || secrets.PVZGE_SERVER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PVZGE_SERVER)) {
            Write-Warning "没有服务器地址：产物需要用户手填"
            flutter build windows --release
          } else {
            flutter build windows --release --dart-define=PVZGE_SERVER=$env:PVZGE_SERVER
          }
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed" }

      - name: Package zip + checksum
        run: |
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path $release)) { throw "missing $release" }
          $version = (Select-String -Path "pubspec.yaml" -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $safe = $version -replace '[+]', '-'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/gardendless-loader-$safe-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$release\*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Out-File -Encoding ascii "$zip.sha256"
          "VERSION=$safe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "SHA256=$hash" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "ZIP=$zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Host "zip=$zip size=$([math]::Round((Get-Item $zip).Length/1MB,1))MB sha256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gardendless-loader-${{ env.VERSION }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exists = gh release view $tag 2>$null
          if ([string]::IsNullOrWhiteSpace($exists)) {
            gh release create $tag --title "$tag — Windows x64" --notes "Windows 桌面客户端（CEF 内核，本地/在线双形态）"
          }
          gh release upload $tag "$env:ZIP" "$env:ZIP.sha256" --clobber
